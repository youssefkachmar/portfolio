<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>404 — Page Not Found | Youssef Kachmar</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; padding: 0; background: #000; color: #ededed; font-family: 'Outfit', sans-serif; min-height: 100%; }
        .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .code { font-family: 'Fira Code', monospace; color: #a1a1aa; font-size: 0.9rem; margin-bottom: 2rem; letter-spacing: 1px; }
        h1 { font-size: clamp(4rem, 14vw, 9rem); margin: 0 0 1rem; letter-spacing: -2px; background: linear-gradient(135deg, #ffffff 0%, #666666 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        h2 { font-size: clamp(1.25rem, 3vw, 2rem); margin: 0 0 1rem; font-weight: 600; }
        p { color: #a3a3a3; max-width: 520px; margin: 0 0 2.5rem; line-height: 1.6; }
        a.btn { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; color: #000; padding: 0.9rem 1.75rem; border-radius: 6px; font-weight: 600; text-decoration: none; transition: all 0.2s ease; }
        a.btn:hover { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="code">ERR_ROUTE_NOT_FOUND &middot; ICMP unreachable</div>
        <h1>404</h1>
        <h2>This packet couldn't be routed.</h2>
        <p>The page you're looking for doesn't exist or was moved. Let's route you back to the homepage.</p>
        <a class="btn" href="/portfolio/">&larr; Back to home</a>
    </main>
</body>
</html>
